# AnyXboxX root Cargo workspace: the target of the move to 100 % Rust (docs/architecture-rust.md).
#
# Every AnyXboxX crate is in crates/ (rust/ was merged in phase 1). Two trees keep their own
# workspace and are excluded here, because Cargo refuses a package that two workspaces claim, and a
# package excluded by its own workspace (VIctory's tests/fixtures) would otherwise climb up to this one:
# - third_party/   : VIctory (its own toolchain pin and lints) and the TomBox submodule; our crates
#                    depend on VIctory's crates by path instead of re-declaring them as members;
# - .claude/       : Claude Code worktrees, which hold full checkouts of this repository.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party", ".claude"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Reused as is from VIctory (our code since #199): never re-implemented here.
victory-pe = { path = "third_party/victory/crates/victory-pe" }
# With `diagnostics`: VIctory is only built and run with it (tools/lancer_victory.ps1, anyxboxx run),
# and victory-gpu does not compile without it at this commit (`queue::presented` is gated).
victory-hle = { path = "third_party/victory/crates/victory-hle", features = ["diagnostics"] }

# Same versions as VIctory's workspace, so both share one set of downloaded crates.
thiserror = "2.0.21"
clap = { version = "4.6.9", features = ["derive"] }
# Small pure-Rust XML reader (MIT OR Apache-2.0), for MicrosoftGame.Config.
roxmltree = "0.20"

# Ported AnyXboxX crates.
anyxboxx-pe = { path = "crates/anyxboxx-pe" }
anyxboxx-report = { path = "crates/anyxboxx-report" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# As in VIctory: chunk sizes are named constants, `as_chunks` would not read better.
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
debug = "line-tables-only"
